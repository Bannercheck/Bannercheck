name: Update Credly badges

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild badge section
        env:
          CREDLY_USER: tayfur-ozkara.4537ea6c
        run: sh scripts/update-credly-badges.sh
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "README unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Credly badges"
          git push
